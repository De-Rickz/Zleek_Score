services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: zleek_db
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TS_TUNE_MEMORY=2GB
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./infra/sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./infra/sql/migrations/domain_model.sql:/docker-entrypoint-initdb.d/02_domain_model.sql
    

  redis:
    image: redis:7-alpine
    container_name: zleek_redis
    ports:
      - "6379:6379"
    restart: always