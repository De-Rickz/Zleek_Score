services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: zleek_db
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_PASSWORD=Drinking451
      - TS_TUNE_MEMORY=on
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    
    

  redis:
    image: redis:7-alpine
    container_name: zleek_redis
    ports:
      - "6379:6379"
    restart: always