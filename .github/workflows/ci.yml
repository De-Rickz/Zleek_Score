# Checks only: lint, types, build and tests on every pull request and every
# push to main. No secrets, no production credentials, no network access to
# the server or the Polymarket APIs (tests with a live part skip it and say
# so). Building and publishing images is a separate, post-v1 item
# (infra/TODO.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Not a secret: lib/db.ts requires the variable at import time, and this
      # address is unreachable, so a page that tried to query the database at
      # build time would fail the build instead of reaching anything.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22          # as apps/web/Dockerfile (node:22-slim)
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  worker:
    name: Worker (offline tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"    # as apps/worker/Dockerfile (python:3.11-slim)
          cache: pip
          cache-dependency-path: apps/worker/requirements.txt
      - run: pip install -r apps/worker/requirements.txt
      - name: Offline tests (live parts are skipped and listed)
        run: apps/worker/tests/run_offline.sh
        env:
          ZLEEK_TEST_PYTHON: python

  trades-archive:
    name: trades_archive integration (TimescaleDB 2.31.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      timescaledb:
        image: timescale/timescaledb:2.31.0-pg16   # production's version (docker-compose.prod.yml)
        env:
          POSTGRES_PASSWORD: test                   # throwaway service container, not a secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Is the trades_archive migration on this branch?
        id: present
        run: |
          if [ -f infra/sql/migrations/test_trades_archive.sh ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::infra/sql/migrations/test_trades_archive.sh is not on this branch (trades_archive not merged yet)"
          fi
      - uses: actions/setup-python@v5
        if: steps.present.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/worker/requirements.txt
      - if: steps.present.outputs.run == 'true'
        run: pip install -r apps/worker/requirements.txt && psql --version
      - name: SQL checks + worker end-to-end against the service container
        if: steps.present.outputs.run == 'true'
        run: infra/sql/migrations/test_trades_archive.sh
        env:
          ZLEEK_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
          ZLEEK_TEST_PYTHON: python

  storage-retention:
    name: storage_retention integration (TimescaleDB 2.31.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      timescaledb:
        image: timescale/timescaledb:2.31.0-pg16   # production's version (docker-compose.prod.yml)
        env:
          POSTGRES_PASSWORD: test                   # throwaway service container, not a secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Retention, compression and hypertable conversion
        run: infra/sql/migrations/test_storage_retention.sh
        env:
          ZLEEK_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
